
name: WatchMouse

options:
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"

targets:
  WatchMouseiPhone:
    type: application
    platform: iOS
    sources:
      - path: iPhoneApp
    dependencies:
      - target: WatchMouse
        embed: true
    info:
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "WatchMouse connects to your Windows computer to control the mouse."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommy.airmouse.iphone
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

  WatchMouse:
    type: application
    platform: watchOS
    sources:
      - path: WatchMouse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommy.airmouse.iphone.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.tommy.airmouse.iphone
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
