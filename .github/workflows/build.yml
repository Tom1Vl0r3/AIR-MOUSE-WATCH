name: AIR-MOUSE-WATCH Cloud Mac

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check-mac:
    runs-on: macos-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Check Xcode and watchOS
        run: |
          echo "=== XCODE VERSION ==="
          xcodebuild -version

          echo "=== AVAILABLE SDKs ==="
          xcodebuild -showsdks

          echo "=== AVAILABLE SIMULATOR RUNTIMES ==="
          xcrun simctl list runtimes

          echo "=== WATCHOS DEVICES ==="
          xcrun simctl list devices available | grep -i watch || true
