
name: AIR-MOUSE-WATCH Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-watch-app:
    runs-on: macos-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Apple Watch app
        run: |
          xcodebuild \
            -project WatchMouse.xcodeproj \
            -scheme WatchMouse \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iPhone companion app
        run: |
          xcodebuild \
            -project WatchMouse.xcodeproj \
            -scheme WatchMouseiPhone \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload compiled apps
        uses: actions/upload-artifact@v4
        with:
          name: AIR-MOUSE-WATCH-Simulator-Builds
          path: |
            build/DerivedData/Build/Products/Debug-iphonesimulator/WatchMouseiPhone.app
            build/DerivedData/Build/Products/Debug-watchsimulator/WatchMouse.app
          if-no-files-found: error
